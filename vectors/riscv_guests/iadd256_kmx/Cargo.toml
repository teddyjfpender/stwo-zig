[package]
name = "iadd256-kmx-rv32"
version = "0.1.0"
edition = "2021"
build = "build.rs"

[[bin]]
name = "iadd256_kmx"
path = "src/main.rs"

[dependencies]
sha2 = { version = "0.10.9", default-features = false }
sha3 = { version = "0.10.8", default-features = false }

[profile.release]
panic = "abort"
opt-level = 3
lto = true
codegen-units = 1
