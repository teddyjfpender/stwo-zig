[package]
name = "stwo-backend-cuda"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "CUDA GPU proving backend for STWO (compile-gated; stub without nvcc)"

[features]
parallel = ["stwo/parallel", "stwo-constraint-framework/parallel"]
test-only-empty-aot-pack = ["stwo-backend-cuda-kernels/test-only-empty-aot-pack"]
test-only-relation-ab = ["stwo-backend-cuda-kernels/test-only-relation-ab"]

[dependencies]
blake3.workspace = true
itertools.workspace = true
num-traits.workspace = true
rayon.workspace = true
serde.workspace = true
stwo = { path = "../stwo", version = "~2.2.0", features = ["prover"] }
stwo-backend-cuda-kernels = { path = "../backend-cuda-kernels" }
stwo-constraint-framework = { path = "../constraint-framework", version = "~2.2.0", features = [
    "prover",
] }

[dev-dependencies]
rand.workspace = true
serde_json = "1.0"
stwo-backend-testkit = { path = "../backend-testkit" }

[lib]
bench = false
