[package]
name = "stwo-backend-cuda-kernels"
version = "0.1.0"
edition = "2021"
description = "Compile-gated CUDA kernel library for a future stwo-backend-cuda"
license = "Apache-2.0"

[lib]
path = "src/lib.rs"

[dependencies]
blake3.workspace = true

[dev-dependencies]
serde.workspace = true
serde_json = "1.0"

[build-dependencies]
blake3.workspace = true
serde.workspace = true
serde_json = "1.0"

[features]
# Compile the ordinary CUDA archive but deliberately embed no generated AOT
# cubins. This exists only for narrow native kernel differential tests; strict
# resident proving fails closed on the resulting empty pack.
test-only-empty-aot-pack = []
# Expose the dormant same-binary relation-selector differential entry points
# to the backend's native CUDA test binary. Production callers have no Rust
# binding to these symbols.
test-only-relation-ab = []
