[package]
name = "stwo-backend-testkit"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Conformance test kit for STWO proving backends"

[features]
parallel = ["stwo/parallel", "stwo-constraint-framework/parallel"]

[dependencies]
itertools.workspace = true
num-traits.workspace = true
rand.workspace = true
stwo = { path = "../stwo", version = "~2.2.0", features = ["prover"] }
stwo-constraint-framework = { path = "../constraint-framework", version = "~2.2.0", features = [
    "prover",
] }

[lib]
bench = false
