[package]
name = "stwo-backend-metal"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Metal GPU proving backend for STWO (Apple Silicon)"

[features]
parallel = ["stwo/parallel", "stwo-constraint-framework/parallel"]

[dependencies]
hashbrown.workspace = true
itertools.workspace = true
num-traits.workspace = true
rayon = { workspace = true, optional = false }
serde.workspace = true
stwo = { path = "../stwo", version = "~2.2.0", features = ["prover"] }
stwo-backend-metal-sys = { path = "../backend-metal-sys", version = "~2.2.0" }
stwo-constraint-framework = { path = "../constraint-framework", version = "~2.2.0", features = [
    "prover",
] }

[dev-dependencies]
rand.workspace = true
stwo-backend-testkit = { path = "../backend-testkit" }

[lib]
bench = false
