<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 410" role="img" aria-labelledby="title desc">
  <title id="title">Packed four-lane reduction circuit for a private dot-and-sum example</title>
  <desc id="desc">Private packed x and weights form a pointwise product. Both packed x and that product pass through QM31 multiplication by a fixed constant D and a base-coordinate mask M. The resulting sums 17 and 279 are added to public result 296. Each arrow is a circuit wire dependency, not an AIR row.</desc>
  <style>
    .bg{fill:#f8fafc}.box{fill:#fff;stroke:#cbd5e1;stroke-width:2}.text{fill:#172033}.muted{fill:#526174}.line{fill:none;stroke:#55718b;stroke-width:2.5}.input{fill:#dbeafe;stroke:#60a5fa}.gate{fill:#ede9fe;stroke:#a78bfa}.sum{fill:#dcfce7;stroke:#4ade80}
    text{font-family:system-ui,-apple-system,sans-serif;font-size:16px;text-anchor:middle}.small{font-size:13px}.heading{font-size:21px;font-weight:750}.label{font-size:17px;font-weight:700}
    @media(prefers-color-scheme:dark){.bg{fill:#111b26}.box{fill:#1d2b3a;stroke:#496078}.text{fill:#edf3fa}.muted{fill:#adbdce}.line{stroke:#91a9c0}.input{fill:#173653;stroke:#57a1ec}.gate{fill:#39305a;stroke:#ad94f1}.sum{fill:#164633;stroke:#51d58d}}
  </style>
  <defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M1 1 L8 4.5 L1 8" fill="none" stroke="#55718b" stroke-width="1.5"/></marker></defs>
  <rect class="bg" x="1" y="1" width="1098" height="408" rx="16"/>
  <text class="text heading" x="550" y="37">Four private positions become one public field value</text>
  <text class="muted small" x="550" y="62">Each purple box is one constrained circuit gate. Four M31 values remain packed until the two-gate reductions.</text>

  <path class="line" d="M190 133 H275" marker-end="url(#arrow)"/>
  <path class="line" d="M190 133 H220 V247 H320 V270" marker-end="url(#arrow)"/>
  <path class="line" d="M190 305 H270" marker-end="url(#arrow)"/>
  <path class="line" d="M410 305 H475" marker-end="url(#arrow)"/>
  <path class="line" d="M385 133 H425" marker-end="url(#arrow)"/>
  <path class="line" d="M535 133 H575" marker-end="url(#arrow)"/>
  <path class="line" d="M695 133 H750 V193 H790" marker-end="url(#arrow)"/>
  <path class="line" d="M585 305 H625" marker-end="url(#arrow)"/>
  <path class="line" d="M735 305 H770" marker-end="url(#arrow)"/>
  <path class="line" d="M880 305 H890 V227" marker-end="url(#arrow)"/>
  <path class="line" d="M900 175 H950" marker-end="url(#arrow)"/>

  <rect class="box input" x="20" y="100" width="170" height="66" rx="10"/><text class="text label" x="105" y="127">private X</text><text class="text small" x="105" y="148">(2,3,5,7)</text>
  <rect class="box input" x="20" y="272" width="170" height="66" rx="10"/><text class="text label" x="105" y="299">private W</text><text class="text small" x="105" y="320">(11,13,17,19)</text>
  <rect class="box gate" x="275" y="100" width="110" height="66" rx="10"/><text class="text label" x="330" y="140">× D</text>
  <rect class="box gate" x="425" y="100" width="110" height="66" rx="10"/><text class="text label" x="480" y="140">⊙ M</text>
  <rect class="box sum" x="575" y="100" width="120" height="66" rx="10"/><text class="text label" x="635" y="127">total</text><text class="text small" x="635" y="148">17</text>
  <rect class="box gate" x="270" y="272" width="140" height="66" rx="10"/><text class="text label" x="340" y="299">pointwise ×</text><text class="text small" x="340" y="320">P=(22,39,85,133)</text>
  <rect class="box gate" x="475" y="272" width="110" height="66" rx="10"/><text class="text label" x="530" y="312">× D</text>
  <rect class="box gate" x="625" y="272" width="110" height="66" rx="10"/><text class="text label" x="680" y="312">⊙ M</text>
  <rect class="box sum" x="770" y="272" width="110" height="66" rx="10"/><text class="text label" x="825" y="299">weighted</text><text class="text small" x="825" y="320">279</text>
  <rect class="box gate" x="790" y="160" width="110" height="66" rx="10"/><text class="text label" x="845" y="199">add</text>
  <rect class="box sum" x="950" y="160" width="120" height="66" rx="10"/><text class="text label" x="1010" y="187">public result</text><text class="text small" x="1010" y="208">296</text>

  <text class="muted small" x="550" y="379">D is a fixed QM31 multiplier. M=(1,0,0,0) keeps the base coordinate. Arrows show wire dependencies.</text>
</svg>
