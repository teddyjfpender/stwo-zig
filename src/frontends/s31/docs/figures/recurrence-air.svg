<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 360" role="img" aria-labelledby="title desc">
  <title id="title">Repeated-step AIR rows connect a four-lane path</title>
  <desc id="desc">Public x equals the input tuple of row zero. Row zero's output tuple 8, 11, 16, 23 equals row one's input. Row one's output tuple 71, 128, 263, 536 connects through later rows to row fifteen and public y.</desc>
  <style>
    .bg{fill:#f8fafc}.card{fill:#fff;stroke:#cbd5e1;stroke-width:2}.endpoint{fill:#dbeafe;stroke:#60a5fa;stroke-width:2}.text{fill:#172033}.muted{fill:#526174}.line{fill:none;stroke:#55718b;stroke-width:2.5}
    text{font-family:system-ui,-apple-system,sans-serif;text-anchor:middle}.head{font-size:21px;font-weight:750}.label{font-size:17px;font-weight:700}.small{font-size:14px}.tuple{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:13px;text-anchor:start}
    @media(prefers-color-scheme:dark){.bg{fill:#111b26}.card{fill:#1d2b3a;stroke:#496078}.endpoint{fill:#173653;stroke:#57a1ec}.text{fill:#edf3fa}.muted{fill:#adbdce}.line{stroke:#91a9c0}}
  </style>
  <defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M1 1 L8 4.5 L1 8" fill="none" stroke="#55718b" stroke-width="1.5"/></marker></defs>
  <rect class="bg" x="1" y="1" width="1078" height="358" rx="16"/>
  <text class="text head" x="540" y="38">R = 16: one row per round, four lane values per row</text>
  <rect class="endpoint" x="25" y="116" width="115" height="104" rx="11"/>
  <text class="text label" x="82" y="150">public x</text><text class="text tuple" x="40" y="187">[1,2,3,4]</text>
  <path class="line" d="M140 168 H167" marker-end="url(#arrow)"/>
  <rect class="card" x="172" y="91" width="184" height="154" rx="11"/>
  <text class="text label" x="264" y="121">row 0 · index 0</text>
  <text class="text tuple" x="185" y="160">in  [1,2,3,4]</text>
  <text class="text tuple" x="185" y="193">out [8,11,16,23]</text>
  <path class="line" d="M356 168 H382" marker-end="url(#arrow)"/>
  <text class="muted small" x="369" y="278">O₀ = I₁</text>
  <rect class="card" x="387" y="91" width="212" height="154" rx="11"/>
  <text class="text label" x="493" y="121">row 1 · index 1</text>
  <text class="text tuple" x="400" y="160">in  [8,11,16,23]</text>
  <text class="text tuple" x="400" y="193">out [71,128,263,536]</text>
  <path class="line" d="M599 168 H625" marker-end="url(#arrow)"/>
  <text class="muted" x="653" y="176" font-size="27">···</text>
  <path class="line" d="M682 168 H707" marker-end="url(#arrow)"/>
  <rect class="card" x="712" y="91" width="193" height="154" rx="11"/>
  <text class="text label" x="808" y="121">row 15 · index 15</text>
  <text class="text tuple" x="725" y="160">in  s[15,0..3]</text>
  <text class="text tuple" x="725" y="193">out s[16,0..3]</text>
  <path class="line" d="M905 168 H931" marker-end="url(#arrow)"/>
  <rect class="endpoint" x="936" y="116" width="119" height="104" rx="11"/>
  <text class="text label" x="995" y="150">public y</text><text class="text small" x="995" y="187">s[16,0..3]</text>
  <text class="muted small" x="540" y="317">Every row proves out[j] = in[j]² + 7 mod p; indexed lookup tuples prove the arrows.</text>
</svg>
