[package]
name = "stwo-mantle-native"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
publish = false

# This is deliberately NOT a member of the ordinary OP guest workspace.
[workspace]
resolver = "2"

[dependencies]
kona-executor = { git = "https://github.com/mantle-xyz/mantle-v2", rev = "305d78b348748e47bd0fe2d4d95bb29ddb10f9ba", default-features = false }
kona-genesis = { git = "https://github.com/mantle-xyz/mantle-v2", rev = "305d78b348748e47bd0fe2d4d95bb29ddb10f9ba", default-features = false, features = ["serde"] }
kona-mpt = { git = "https://github.com/mantle-xyz/mantle-v2", rev = "305d78b348748e47bd0fe2d4d95bb29ddb10f9ba", default-features = false }
alloy-op-evm = { git = "https://github.com/mantle-xyz/mantle-v2", rev = "305d78b348748e47bd0fe2d4d95bb29ddb10f9ba", default-features = false }
op-alloy-rpc-types-engine = { git = "https://github.com/mantle-xyz/mantle-v2", rev = "305d78b348748e47bd0fe2d4d95bb29ddb10f9ba", default-features = false, features = ["serde"] }
alloy-consensus = { version = "=2.0.4", default-features = false, features = ["serde", "k256"] }
alloy-primitives = { version = "=1.5.6", default-features = false, features = ["serde", "rlp"] }
alloy-rlp = "=0.3.13"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "=0.10.9"

# Patches in a git dependency's workspace do NOT apply to this consumer root.
# Mirror the official coherent Mantle family here; never patch the OP workspace.
[patch.crates-io]
revm = { git = "https://github.com/mantle-xyz/revm", rev = "835cb4eb742698c5884248f546c68c9d716cc995" }
revm-bytecode = { git = "https://github.com/mantle-xyz/revm", rev = "835cb4eb742698c5884248f546c68c9d716cc995" }
revm-context = { git = "https://github.com/mantle-xyz/revm", rev = "835cb4eb742698c5884248f546c68c9d716cc995" }
revm-context-interface = { git = "https://github.com/mantle-xyz/revm", rev = "835cb4eb742698c5884248f546c68c9d716cc995" }
revm-database = { git = "https://github.com/mantle-xyz/revm", rev = "835cb4eb742698c5884248f546c68c9d716cc995" }
revm-database-interface = { git = "https://github.com/mantle-xyz/revm", rev = "835cb4eb742698c5884248f546c68c9d716cc995" }
revm-handler = { git = "https://github.com/mantle-xyz/revm", rev = "835cb4eb742698c5884248f546c68c9d716cc995" }
revm-inspector = { git = "https://github.com/mantle-xyz/revm", rev = "835cb4eb742698c5884248f546c68c9d716cc995" }
revm-interpreter = { git = "https://github.com/mantle-xyz/revm", rev = "835cb4eb742698c5884248f546c68c9d716cc995" }
revm-precompile = { git = "https://github.com/mantle-xyz/revm", rev = "835cb4eb742698c5884248f546c68c9d716cc995" }
revm-primitives = { git = "https://github.com/mantle-xyz/revm", rev = "835cb4eb742698c5884248f546c68c9d716cc995" }
revm-state = { git = "https://github.com/mantle-xyz/revm", rev = "835cb4eb742698c5884248f546c68c9d716cc995" }
op-revm = { git = "https://github.com/mantle-xyz/revm", rev = "835cb4eb742698c5884248f546c68c9d716cc995" }
