[package]
name = "stwo-kona-rv64-lean"
version = "0.1.0"
edition = "2024"
publish = false
build = "build.rs"

[workspace]

[[bin]]
name = "stwo-kona-rv64-lean"
path = "../guest/src/main.rs"

[features]
default = ["sponge-service"]
eager-preimages = []
keccak-service = ["stwo-kona-execution/keccak-service"]
services-v3 = ["keccak-service", "stwo-kona-execution/secp-lean"]
sponge-service = ["services-v3"]
memory-service = ["stwo-rv64-mem/admitted-bulk"]

[dependencies]
stwo-kona-execution = { path = ".." }
stwo-rv64-mem = { path = "../../../autoresearch/benchmarks/guest_runtime/ethereum/rv64/mem" }
critical-section = { version = "1.2", features = ["restore-state-bool"] }

[patch.crates-io]
k256 = { path = "../../../autoresearch/benchmarks/guest_runtime/ethereum/rv64/vendor/k256" }
ecdsa = { path = "../../../autoresearch/benchmarks/guest_runtime/ethereum/rv64/vendor/ecdsa" }
revm-interpreter = { path = "../../../autoresearch/benchmarks/guest_runtime/ethereum/rv64/vendor/revm-interpreter" }
revm-bytecode = { path = "../../../autoresearch/benchmarks/guest_runtime/ethereum/rv64/vendor/revm-bytecode" }

[profile.release]
panic = "abort"
opt-level = 3
lto = "thin"
codegen-units = 1

[profile.frontier]
inherits = "release"
lto = "fat"

[patch."https://github.com/ethereum-optimism/optimism"]
kona-mpt = { path = "../vendor/kona-mpt" }
