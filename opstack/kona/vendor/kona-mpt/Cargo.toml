[package]
name = "kona-mpt"
version = "0.3.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false
repository = "https://github.com/ethereum-optimism/optimism"

[workspace]

[dependencies]
thiserror = { version = "2.0.18", default-features = false }
serde = { version = "1.0", default-features = false, optional = true, features = ["derive", "alloc"] }
alloy-rlp = { version = "0.3.16", default-features = false, features = ["derive"] }
alloy-trie = { version = "0.9.4", default-features = false }
alloy-primitives = { version = "=1.6.1", default-features = false, features = ["rlp", "map-foldhash"] }
op-alloy-rpc-types-engine = { git = "https://github.com/ethereum-optimism/optimism", rev = "a271fd6b3feb76e49f3453e5a27be4b33a3c7211", default-features = false }

[dev-dependencies]
# Keep macro expansion on the same ABI revision as the pinned sol-types.
alloy-sol-macro = "=1.6.1"
alloy-sol-macro-expander = "=1.6.1"
syn-solidity = "=1.6.1"
alloy-provider = { version = "=2.3.0", default-features = false, features = ["reqwest", "debug-api"] }
alloy-consensus = { version = "=2.3.0", default-features = false }
alloy-transport-http = { version = "=2.3.0", default-features = false, features = ["reqwest-rustls-tls"] }
alloy-rpc-types = { version = "=2.3.0", default-features = false, features = ["eth", "debug"] }
rand = { version = "0.9.2", default-features = false, features = ["thread_rng"] }
reqwest = { version = "0.13.2", default-features = false, features = ["query"] }
proptest = "1.10.0"
tokio = { version = "1.49.0", default-features = false, features = ["full"] }

[features]
default = ["serde"]
serde = ["alloy-primitives/serde", "alloy-trie/serde", "dep:serde", "op-alloy-rpc-types-engine/serde"]
