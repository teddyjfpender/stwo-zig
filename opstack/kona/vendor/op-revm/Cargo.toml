[package]
name = "op-revm"
description = "Optimism variant of Revm"
version = "20.0.0"
publish = false
authors = ["Op Stack Contributors"]
edition = "2024"
keywords = ["ethereum", "optimism", "crypto"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/ethereum-optimism/optimism"
rust-version = "1.95"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]


[dependencies]
# revm
revm = { version = "42.0.1", default-features = false }
auto_impl = { version = "1.3.0" }

# alloy
alloy-eips = { version = "2.3.0", default-features = false }

# op-alloy
op-alloy-consensus = { version = "2.0.0", default-features = false, git = "https://github.com/ethereum-optimism/optimism", rev = "a271fd6b3feb76e49f3453e5a27be4b33a3c7211" }

# Optional
serde = { version = "1.0.228", default-features = false, features = ["derive", "rc"], optional = true }

[dev-dependencies]
rstest = { version = "0.26.1" }
alloy-sol-types = { version = "1.6.1", default-features = false }
sha2 = { version = "0.10.9", default-features = false }
serde_json = { version = "1.0.149", default-features = false, features = ["alloc", "preserve_order"] }
serde = { version = "1.0.228", default-features = false, features = ["derive"] }
alloy-primitives = { version = "1.6.1", default-features = false, features = ["map-foldhash"] }

[features]
default = ["std", "c-kzg", "secp256k1", "portable", "blst"]
std = [
	"serde?/std",
	"revm/std",
	"alloy-eips/std",
	"op-alloy-consensus/std",
	"alloy-sol-types/std",
	"sha2/std",
	"serde_json/std",
	"alloy-primitives/std",
]
serde = ["dep:serde", "revm/serde", "alloy-eips/serde", "alloy-primitives/serde", "op-alloy-consensus/serde"]
portable = ["revm/portable"]

dev = [
	"revm/dev",
	"memory_limit",
	"optional_balance_check",
	"optional_block_gas_limit",
	"optional_eip3541",
	"optional_eip3607",
	"optional_no_base_fee",
]
memory_limit = ["revm/memory_limit"]
optional_balance_check = ["revm/optional_balance_check"]
optional_block_gas_limit = ["revm/optional_block_gas_limit"]
optional_eip3541 = ["revm/optional_eip3541"]
optional_eip3607 = ["revm/optional_eip3607"]
optional_no_base_fee = ["revm/optional_no_base_fee"]
optional_fee_charge = ["revm/optional_fee_charge"]

# See comments in `revm-precompile`
secp256k1 = ["revm/secp256k1"]
c-kzg = ["revm/c-kzg"]
blst = ["revm/blst"]
bn = ["revm/bn"]

[workspace]
