name: Zig package release

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Git commit, tag, or branch to package
        required: true
        default: main
        type: string
  push:
    tags:
      - "v*"

permissions: {}

concurrency:
  group: zig-package-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  archives:
    runs-on: ubuntu-latest
    outputs:
      source_sha: ${{ steps.source.outputs.sha }}
    permissions:
      contents: read
    steps:
      - name: Check out exact source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.source_ref || github.ref }}
      - name: Record immutable source identity
        id: source
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
      - name: Validate package contracts and release tooling
        run: |
          python3 scripts/check_package_workspace.py
          python3 -m unittest scripts.tests.test_package_release -v
      - name: Build deterministic Zig source archives
        run: python3 scripts/package_release.py --output zig-out/packages
      - name: Upload immutable package set
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: zig-source-packages-${{ steps.source.outputs.sha }}
          path: zig-out/packages/
          if-no-files-found: error
          retention-days: 30

  clean-room-linux:
    needs: archives
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        package:
          - stwo_core
          - stwo_prover_engine
          - stwo_cpu_backend
          - stwo_riscv_frontend
          - stwo_cairo_frontend
          - stwo_sm83_frontend
    steps:
      - name: Setup Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: 0.15.2
      - name: Download source packages
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: zig-source-packages-${{ needs.archives.outputs.source_sha }}
          path: packages
      - name: Build package from only its published closure
        env:
          PACKAGE: ${{ matrix.package }}
        run: |
          set -euo pipefail
          archive=$(python3 -c 'import json,os; p=json.load(open("packages/index.json")); print(next(x["archive"] for x in p["archives"] if x["package"] == os.environ["PACKAGE"]))')
          mkdir extracted
          tar -xf "packages/$archive" -C extracted
          root="extracted/${archive%.tar}"
          build_file=$(ROOT="$root" python3 -c 'import json,os; print(json.load(open(os.path.join(os.environ["ROOT"], "PACKAGE-RELEASE.json")))["root_build_file"])')
          zig build test --build-file "$root/$build_file" -Doptimize=ReleaseSafe -j2

  clean-room-macos:
    needs: archives
    runs-on: macos-latest
    permissions:
      contents: read
    steps:
      - name: Setup Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: 0.15.2
      - name: Download source packages
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: zig-source-packages-${{ needs.archives.outputs.source_sha }}
          path: packages
      - name: Build Metal package from only its published closure
        run: |
          set -euo pipefail
          archive=$(python3 -c 'import json; p=json.load(open("packages/index.json")); print(next(x["archive"] for x in p["archives"] if x["package"] == "stwo_metal_backend"))')
          mkdir extracted
          tar -xf "packages/$archive" -C extracted
          root="extracted/${archive%.tar}"
          zig build test --build-file "$root/src/backends/metal/build.zig" -Doptimize=ReleaseSafe -j2

  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [archives, clean-room-linux, clean-room-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download verified source packages
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: zig-source-packages-${{ needs.archives.outputs.source_sha }}
          path: packages
      - name: Publish atomic GitHub release assets
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$REPOSITORY" >/dev/null 2>&1; then
            test "$(gh release view "$TAG" --repo "$REPOSITORY" --json isDraft --jq .isDraft)" = true
          else
            gh release create "$TAG" --repo "$REPOSITORY" \
              --verify-tag --generate-notes --draft
          fi
          gh release upload "$TAG" --repo "$REPOSITORY" packages/*
          gh release edit "$TAG" --repo "$REPOSITORY" --draft=false
