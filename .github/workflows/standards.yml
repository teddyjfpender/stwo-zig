name: Standards

# Security and supply-chain gates required by ENGINEERING_STANDARDS.md
# ("Security and licensing gates"). Both jobs are cheap, hosted-only and
# independent of the product build graph.

on:
  pull_request:
  push:
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: standards-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    name: Secret scanning
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - name: Checkout complete comparison history
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install pinned gitleaks
        run: |
          set -euo pipefail
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL --retry 3 -o "$RUNNER_TEMP/$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$archive"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/$archive" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" version

      - name: Scan the commits this change introduces
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_REF: ${{ github.base_ref }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          PUSH_AFTER_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "pull_request" ]; then
            # Diff against the live merge-base, as ci.yml does: the event's
            # base.sha can lag the base branch.
            base="$(git merge-base "origin/${PR_BASE_REF}" "$PR_HEAD_SHA")"
            range="${base}..${PR_HEAD_SHA}"
          elif [[ "$PUSH_BEFORE_SHA" =~ ^0+$ ]]; then
            range="-1 ${PUSH_AFTER_SHA}"
          else
            range="${PUSH_BEFORE_SHA}..${PUSH_AFTER_SHA}"
          fi
          echo "Scanning: $range"
          "$RUNNER_TEMP/gitleaks" git \
            --no-banner \
            --redact \
            --exit-code 1 \
            --config .github/gitleaks.toml \
            --log-opts="$range" \
            .

  dependency-review:
    name: Dependency and licence policy
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Reject vulnerable or copyleft-incompatible dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294  # v5.0.0
        with:
          fail-on-severity: high
          license-check: true
          deny-licenses: >-
            AGPL-1.0-only, AGPL-1.0-or-later, AGPL-3.0-only, AGPL-3.0-or-later,
            GPL-2.0-only, GPL-2.0-or-later, GPL-3.0-only, GPL-3.0-or-later,
            SSPL-1.0, BUSL-1.1
