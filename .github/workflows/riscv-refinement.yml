# Repository-wide RISC-V formal refinement gate (issues #136/#137).
#
# The 46 admitted RV32IM opcodes form one manifest-wide verification surface.
# Historical contributor partitions remain only in compatibility scripts and
# do not classify jobs, theorem strength, or publication evidence here.
#
# Fail-closed contract. There is no skip path in this workflow. Specifically:
#
#   * If the Lean toolchain cannot be provisioned, the job is RED. It is not
#     skipped, and it is not allowed to pass with the Lean leg absent. That is
#     the whole point of the "absence cannot silently skip a required formal
#     leg" deliverable in Stage B5.
#   * If the production symbolic AIR export fails, the job is RED. The Lean
#     family capsules bind exported AIR digests, so an unexportable AIR means
#     the binding is unverifiable, not that it is fine.
#   * If a Lean family capsule records a digest that no longer matches a fresh
#     export, the job is RED.
#   * The proof-escape scan and the axiom audit are RED on any hit.
#
# What this workflow does NOT do: it does not provision Sail. It checks the
# committed generated-clause bridge receipt through the carried-evidence gate;
# fresh Sail regeneration and the cross-project Lean build run in the separate
# hosted `riscv-sail-formal.yml` workflow. Full fetch/interrupt/trap/counter and
# later-step framing remains open (see
# soundness/RISCV_FRONTEND_VERIFICATION_STATUS.md).

name: RISC-V formal refinement

on:
  pull_request:
    paths:
      - "formal/riscv-refinement/**"
      # The top-level and helper-package globs cover every module reachable
      # from the legacy compatibility gates and their split test suites. The public
      # facades the job executes remain listed explicitly as a reviewable
      # fail-closed trigger contract.
      - "scripts/riscv_team_a*.py"
      - "scripts/riscv_team_b*.py"
      - "scripts/riscv_team_b_witnesses_lib/**"
      - "scripts/riscv_team_b.py"
      - "scripts/riscv_team_b_witnesses.py"
      - "scripts/riscv_team_a.py"
      - "scripts/riscv_opcode_coverage.py"
      - "scripts/riscv_refinement*.py"
      - "scripts/riscv_refinement_lib/**"
      - "scripts/tests/test_riscv_team_b*.py"
      - "scripts/tests/_riscv_team_b_witnesses_*.py"
      - "scripts/tests/test_riscv_team_b.py"
      - "scripts/tests/test_riscv_team_b_witnesses.py"
      - "scripts/tests/test_riscv_team_a.py"
      - "scripts/tests/test_riscv_refinement*.py"
      - "scripts/tests/riscv_refinement_test_support.py"
      - "scripts/tests/test_riscv_refinement.py"
      - "scripts/tests/test_sail_translation.py"
      - "scripts/tests/test_sail_air_composition_contract.py"
      - "scripts/tests/fixtures/sail_translation/**"
      - "conformance/riscv/rv32im-sail-profile.json"
      - "conformance/riscv/sail-lean-riscv-extras.patch"
      - "conformance/riscv/sail-rv32im-override.json"
      - "conformance/riscv/sail-rv32im-tagged-options.json"
      - "conformance/riscv/sail-rvfi-zkvm-entry.patch"
      - "build.zig"
      - "build.zig.zon"
      - "build_support/**"
      - "src/core/**"
      - "src/frontends/riscv/**"
      - "soundness/AIR_IR_V2_CONTRACT.md"
      - "soundness/SAIL_AIR_COMPOSITION.md"
      - "soundness/TEAM_B_SAIL_REFINEMENT_CONTRACT.md"
      - "soundness/UNIVERSAL_AIR_SAIL_REFINEMENT.md"
      - "soundness/air-ir-v2.schema.json"
      - ".github/workflows/riscv-refinement.yml"
  push:
    branches: ["main"]
  schedule:
    # Clean-room regeneration, as provisioning- and cache-rot insurance.
    - cron: "23 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

# The event name is part of the group so a push to main cannot cancel the
# scheduled clean-room run mid-flight: both would otherwise share the
# refs/heads/main group and cancel-in-progress would kill whichever started
# first. Superseded pull-request runs still cancel each other as before.
concurrency:
  group: riscv-refinement-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  air-export:
    name: Fresh production AIR export
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Setup Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: 0.15.2

      # Export once, then make every semantic shard consume these exact bytes.
      # This prevents 23 matrix legs from each recompiling the production
      # frontend while still making the aggregate gate bind fresh AIR.
      - name: Export every family and unsigned opcode program
        run: |
          set -euo pipefail
          zig build riscv-refinement-ir \
            -Driscv-refinement-ir-dir=zig-out/fresh-family-air \
            -Driscv-air-program-ir-dir=zig-out/fresh-opcode-air
          test "$(find zig-out/fresh-family-air -maxdepth 1 -type f -name '*.json' | wc -l | tr -d ' ')" = 17
          test "$(find zig-out/fresh-opcode-air -maxdepth 1 -type f -name '*.unsigned.json' | wc -l | tr -d ' ')" = 46

      - name: Upload the immutable AIR export
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: riscv-refinement-fresh-air-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            zig-out/fresh-family-air
            zig-out/fresh-opcode-air
          if-no-files-found: error
          retention-days: 1

  family-refinement:
    name: Opcode-family refinement gate
    needs: air-export
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"

      - name: Setup Lean at the pinned toolchain
        uses: leanprover/lean-action@38fbc41a8c28c4cbaec22d7f7de508ec2e7c0dd9 # v1.5.0
        with:
          lake-package-directory: formal/riscv-refinement
          build: false
          test: false
          lint: false

      # Provisioning is verified explicitly rather than inferred from a later
      # step's success, so a silently missing toolchain fails here with a clear
      # message instead of turning a formal leg into a no-op.
      - name: Verify the formal toolchain is actually present
        run: |
          set -euo pipefail
          cd formal/riscv-refinement
          expected="$(tr -d '[:space:]' < lean-toolchain)"
          actual="$(lake env lean --version)"
          echo "pinned toolchain: ${expected}"
          echo "resolved lean:    ${actual}"
          case "${expected}" in
            leanprover/lean4:v*) ;;
            *) echo "unrecognised pinned toolchain '${expected}'" >&2; exit 1 ;;
          esac
          version="${expected#leanprover/lean4:v}"
          if ! printf '%s' "${actual}" | grep -qF "${version}"; then
            echo "resolved Lean does not match the pinned toolchain" >&2
            exit 1
          fi

      - name: Download the fresh production AIR
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: riscv-refinement-fresh-air-${{ github.sha }}-${{ github.run_attempt }}
          path: zig-out

      - name: Require the complete family export
        run: |
          set -euo pipefail
          test -s zig-out/fresh-family-air/load_store.json
          test -s zig-out/fresh-family-air/div.json

      - name: Legacy family compatibility and AIR-binding gate
        run: python3 scripts/riscv_team_b.py check --air-ir-dir zig-out/fresh-family-air

      - name: Non-vacuity witnesses are reachable in the shipped AIR
        run: |
          python3 scripts/riscv_team_b_witnesses.py --air-ir-dir zig-out/fresh-family-air

      - name: Build the concrete opcode theorem families
        run: |
          set -euo pipefail
          cd formal/riscv-refinement
          lake build \
            RiscvRefinement.Opcodes.LoadStore \
            RiscvRefinement.Opcodes.LoadStoreMutation \
            RiscvRefinement.Opcodes.LoadStoreMutationExtra \
            RiscvRefinement.Opcodes.LoadMutationByte \
            RiscvRefinement.Opcodes.LoadMutationWord \
            RiscvRefinement.Opcodes.StoreMutation \
            RiscvRefinement.Opcodes.Shifts \
            RiscvRefinement.Opcodes.ShiftsMutation \
            RiscvRefinement.Opcodes.ShiftsRegMutation \
            RiscvRefinement.Opcodes.Multiply \
            RiscvRefinement.Opcodes.MultiplyMutation \
            RiscvRefinement.Opcodes.MultiplyMutationExtra \
            RiscvRefinement.Opcodes.Div \
            RiscvRefinement.Opcodes.DivMutation \
            RiscvRefinement.Opcodes.DivMutationExtra

      - name: Scan for proof escapes
        run: |
          set -euo pipefail
          # Comments are stripped first so the banned words may still be
          # discussed in prose; anything surviving is a real escape. Lean has
          # `--` line comments and `/- ... -/` block comments (including the
          # `/-!` and `/--` doc variants), and block comments nest, which is
          # beyond a line-oriented sed -- hence the small Python scanner.
          # String literals are copied through verbatim so a quoted `/-`
          # cannot open a phantom comment that swallows real code. The step
          # fails closed: a renamed or missing source tree reads as an
          # implausibly small scan, not as a clean one -- the same defensive
          # shape as the axiom-audit step below.
          python3 - <<'PY'
          import pathlib
          import re
          import sys

          root = pathlib.Path("formal/riscv-refinement/RiscvRefinement")
          banned = re.compile(r"\b(sorry|admit|axiom|unsafe|native_decide)\b")

          def strip_comments(text):
              out = []
              depth = 0          # block-comment nesting depth
              in_line = False    # inside a `--` line comment
              in_string = False  # inside a "..." literal outside comments
              i = 0
              n = len(text)
              while i < n:
                  ch = text[i]
                  pair = text[i : i + 2]
                  if in_line:
                      if ch == "\n":
                          in_line = False
                          out.append(ch)
                      i += 1
                  elif depth > 0:
                      if pair == "/-":
                          depth += 1
                          i += 2
                      elif pair == "-/":
                          depth -= 1
                          i += 2
                      else:
                          if ch == "\n":
                              out.append(ch)  # keep line numbers stable
                          i += 1
                  elif in_string:
                      out.append(ch)
                      if ch == "\\" and i + 1 < n:
                          out.append(text[i + 1])
                          i += 2
                      else:
                          if ch == '"':
                              in_string = False
                          i += 1
                  elif pair == "/-":
                      depth += 1
                      i += 2
                  elif pair == "--":
                      in_line = True
                      i += 2
                  else:
                      if ch == '"':
                          in_string = True
                      out.append(ch)
                      i += 1
              return "".join(out)

          files = sorted(root.rglob("*.lean"))
          # The tree holds more than 80 Lean files today; seeing fewer than 80
          # means
          # the scan did not reach the sources it exists to police.
          if len(files) < 80:
              print(
                  f"proof-escape scan saw only {len(files)} Lean files under "
                  f"{root}; refusing to treat an implausibly small scan as "
                  "clean",
                  file=sys.stderr,
              )
              sys.exit(1)

          hits = []
          for path in files:
              stripped = strip_comments(path.read_text(encoding="utf-8"))
              for lineno, line in enumerate(stripped.splitlines(), 1):
                  for match in banned.finditer(line):
                      hits.append(f"{path}:{lineno}: {match.group(0)}")

          if hits:
              print(
                  "forbidden proof escape present in the Lean sources:",
                  file=sys.stderr,
              )
              print("\n".join(hits), file=sys.stderr)
              sys.exit(1)
          print(f"scanned {len(files)} Lean files; no proof escapes")
          PY

      - name: Family compatibility Python gates
        run: |
          set -euo pipefail
          python3 -m unittest scripts.tests.test_riscv_team_b -v
          python3 -m unittest scripts.tests.test_riscv_team_b_witnesses -v
          python3 -m unittest scripts.tests.test_sail_translation -v
          python3 -m unittest scripts.tests.test_sail_air_composition_contract -v

  local-air-shards:
    name: AIR/refinement shard / ${{ matrix.shard }}
    needs: air-export
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          # The 17 rows below are the exact production family set emitted by
          # refinement_program_export_test.zig. Every family builds its concrete
          # refinement and mutation capsules; shared targets are intentionally
          # repeated only where one Lean module covers two extractor families.
          - shard: family-auipc
            targets: "RiscvRefinement.Opcodes.Auipc RiscvRefinement.Opcodes.AuipcMutation"
            python: false
            fresh_air: false
          - shard: family-base_alu_imm
            targets: "RiscvRefinement.Opcodes.BaseAluImm RiscvRefinement.Opcodes.BaseAluMutation"
            python: false
            fresh_air: false
          - shard: family-base_alu_reg
            targets: "RiscvRefinement.Opcodes.BaseAluReg RiscvRefinement.Opcodes.BaseAluMutation"
            python: false
            fresh_air: false
          - shard: family-branch_eq
            targets: "RiscvRefinement.Opcodes.Branches RiscvRefinement.Opcodes.BranchesMutation"
            python: false
            fresh_air: false
          - shard: family-branch_lt
            targets: "RiscvRefinement.Opcodes.Branches RiscvRefinement.Opcodes.BranchesMutation"
            python: false
            fresh_air: false
          - shard: family-div
            targets: "RiscvRefinement.Opcodes.Div RiscvRefinement.Opcodes.DivMutation RiscvRefinement.Opcodes.DivMutationExtra"
            python: false
            fresh_air: false
          - shard: family-fence
            targets: "RiscvRefinement.Opcodes.Fence RiscvRefinement.Opcodes.FenceMutation"
            python: false
            fresh_air: false
          - shard: family-jal
            targets: "RiscvRefinement.Opcodes.Jal RiscvRefinement.Opcodes.JalMutation"
            python: false
            fresh_air: false
          - shard: family-jalr
            targets: "RiscvRefinement.Opcodes.Jalr RiscvRefinement.Opcodes.JalrMutation"
            python: false
            fresh_air: false
          - shard: family-load_store
            targets: "RiscvRefinement.Opcodes.LoadStore RiscvRefinement.Opcodes.LoadStoreMutation RiscvRefinement.Opcodes.LoadStoreMutationExtra RiscvRefinement.Opcodes.LoadMutationByte RiscvRefinement.Opcodes.LoadMutationWord RiscvRefinement.Opcodes.StoreMutation"
            python: false
            fresh_air: false
          - shard: family-lt_imm
            targets: "RiscvRefinement.Air.Bridge.LtImm RiscvRefinement.Opcodes.Lt RiscvRefinement.Opcodes.LtMutation"
            python: false
            fresh_air: false
          - shard: family-lt_reg
            targets: "RiscvRefinement.Air.Bridge.LtReg RiscvRefinement.Opcodes.Lt RiscvRefinement.Opcodes.LtMutation"
            python: false
            fresh_air: false
          - shard: family-lui
            targets: "RiscvRefinement.Opcodes.Lui RiscvRefinement.Air.Bridge.Mutations"
            python: false
            fresh_air: false
          - shard: family-mul
            targets: "RiscvRefinement.Opcodes.Multiply RiscvRefinement.Opcodes.MultiplyMutation RiscvRefinement.Opcodes.MultiplyMutationExtra"
            python: false
            fresh_air: false
          - shard: family-mulh
            targets: "RiscvRefinement.Air.Bridge.MulhBridge RiscvRefinement.Opcodes.Multiply RiscvRefinement.Opcodes.MultiplyMutation RiscvRefinement.Opcodes.MultiplyMutationExtra"
            python: false
            fresh_air: false
          - shard: family-shifts_imm
            targets: "RiscvRefinement.Opcodes.Shifts RiscvRefinement.Opcodes.ShiftsMutation"
            python: false
            fresh_air: false
          - shard: family-shifts_reg
            targets: "RiscvRefinement.Opcodes.Shifts RiscvRefinement.Opcodes.ShiftsRegMutation"
            python: false
            fresh_air: false

          # Cross-cutting obligations cannot be assigned honestly to one AIR
          # family. Keeping them explicit prevents a green family matrix from
          # hiding a missing source, witness, mutation, coverage, or audit leg.
          - shard: source-binding
            targets: "RiscvRefinement.Air.Generated.Programs"
            python: true
            fresh_air: true
          - shard: shared-semantics
            targets: "RiscvRefinement.Common RiscvRefinement.Memory RiscvRefinement.Mutation RiscvRefinement.Air RiscvRefinement.Bridge.DecodeBaseAlu RiscvRefinement.Bridge.DecodeBranches RiscvRefinement.Bridge.DecodeLt RiscvRefinement.Opcodes.Fence"
            python: false
            fresh_air: false
          - shard: non-vacuity
            targets: "RiscvRefinement.NonVacuity RiscvRefinement.Opcodes.SelectorNonVacuity"
            python: false
            fresh_air: false
          - shard: mutations
            targets: "RiscvRefinement.Mutation RiscvRefinement.Air.Bridge.Mutations"
            python: false
            fresh_air: false
          - shard: coverage
            targets: "RiscvRefinement.Publication.Coverage"
            python: true
            fresh_air: false
          - shard: axiom-closure
            targets: "RiscvRefinement"
            python: true
            fresh_air: false

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Setup Python
        if: matrix.python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"

      - name: Setup Lean at the pinned toolchain
        uses: leanprover/lean-action@38fbc41a8c28c4cbaec22d7f7de508ec2e7c0dd9 # v1.5.0
        with:
          lake-package-directory: formal/riscv-refinement
          build: false
          test: false
          lint: false

      - name: Build this shard's concrete Lean targets
        working-directory: formal/riscv-refinement
        run: lake build ${{ matrix.targets }}

      - name: Download fresh AIR for the source-binding shard
        if: matrix.fresh_air
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: riscv-refinement-fresh-air-${{ github.sha }}-${{ github.run_attempt }}
          path: zig-out

      - name: Bind every manifest program to the fresh unsigned export
        if: matrix.shard == 'source-binding'
        run: |
          set -euo pipefail
          python3 scripts/riscv_team_a.py check \
            --air-program-ir-dir zig-out/fresh-opcode-air

      - name: Check exact certificate coverage
        if: matrix.shard == 'coverage'
        run: |
          set -euo pipefail
          python3 scripts/riscv_team_a.py coverage
          python3 scripts/riscv_opcode_coverage.py check

      - name: Audit the complete imported theorem closure
        if: matrix.shard == 'axiom-closure'
        run: |
          set -euo pipefail
          (
            cd formal/riscv-refinement
            lake env lean RiscvRefinement/AxiomAudit.lean > /tmp/a5-axioms.txt
          )
          theorems="$(grep -cE '^REFINEMENT_THEOREM ' /tmp/a5-axioms.txt || true)"
          axioms="$(grep -cE '^REFINEMENT_AXIOM ' /tmp/a5-axioms.txt || true)"
          echo "audited ${theorems} theorems over ${axioms} axiom records"
          if [ "${theorems}" -lt 800 ] || [ "${axioms}" -lt 800 ]; then
            echo "axiom audit reported implausibly little; treating as failure" >&2
            exit 1
          fi
          if grep -E '^REFINEMENT_AXIOM ' /tmp/a5-axioms.txt \
              | grep -vE ' (propext|Classical\.choice|Quot\.sound)$'; then
            echo "unapproved axiom in a refinement theorem" >&2
            exit 1
          fi
          python3 scripts/riscv_team_a.py axioms \
            --audit-output /tmp/a5-axioms.txt

  aggregate:
    name: Aggregate formal refinement gate
    needs:
      - air-export
      - family-refinement
      - local-air-shards
    # A default `needs` fan-in is skipped when an upstream job fails. Run this
    # job regardless and turn every non-success result into an explicit RED
    # aggregate status, so branch protection has one stable required check.
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Require every upstream shard to be green
        env:
          AIR_EXPORT_RESULT: ${{ needs.air-export.result }}
          FAMILY_RESULT: ${{ needs.family-refinement.result }}
          LOCAL_AIR_SHARDS_RESULT: ${{ needs.local-air-shards.result }}
        run: |
          set -euo pipefail
          test "${AIR_EXPORT_RESULT}" = success
          test "${FAMILY_RESULT}" = success
          test "${LOCAL_AIR_SHARDS_RESULT}" = success

      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"

      - name: Download the exact AIR bytes checked by the shards
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: riscv-refinement-fresh-air-${{ github.sha }}-${{ github.run_attempt }}
          path: zig-out

      # This is the required fan-in. It cannot pass unless all 17 family
      # shards, all six cross-cutting shards, and the family leg are green.
      - name: Bind the exact 46-opcode aggregate to fresh production AIR
        run: |
          set -euo pipefail
          python3 scripts/riscv_team_b.py check \
            --air-ir-dir zig-out/fresh-family-air
          python3 scripts/riscv_team_b_witnesses.py \
            --air-ir-dir zig-out/fresh-family-air
          python3 scripts/riscv_team_a.py check \
            --air-program-ir-dir zig-out/fresh-opcode-air
          python3 scripts/riscv_opcode_coverage.py check

      - name: Aggregate Python regression gates
        run: |
          set -euo pipefail
          python3 -m unittest scripts.tests.test_riscv_team_a -v
          python3 -m unittest scripts.tests.test_riscv_refinement -v

  clean-room:
    name: Clean-room regeneration
    # Scheduled and dispatched runs only. The point is to rebuild every derived
    # input from empty caches, which is wasted work on an ordinary pull request
    # and would only teach contributors to ignore a slow required check.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"

      # No setup-zig cache restore and no Lake cache: the whole point is that
      # nothing derived survives from a previous run.
      - name: Setup Zig without a restored cache
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: 0.15.2
          use-cache: false

      - name: Empty every derived cache
        run: |
          set -euo pipefail
          rm -rf .zig-cache zig-out formal/riscv-refinement/.lake/build
          echo "derived caches removed"

      # build and leanchecker together are the independent re-check: Lake
      # rebuilds every theorem from source, then the bundled leanchecker
      # replays the resulting environment through a separate kernel. A proof
      # that only Lake accepts does not survive this step.
      - name: Rebuild and independently kernel-check every theorem
        uses: leanprover/lean-action@38fbc41a8c28c4cbaec22d7f7de508ec2e7c0dd9 # v1.5.0
        with:
          lake-package-directory: formal/riscv-refinement
          build: true
          test: false
          lint: false
          leanchecker: true
          use-github-cache: false

      - name: Regenerate the production symbolic AIR from empty caches
        run: |
          set -euo pipefail
          zig build riscv-refinement-ir \
            -Driscv-refinement-ir-dir=zig-out/family-air \
            -Driscv-air-program-ir-dir=zig-out/opcode-air
          test -s zig-out/family-air/div.json
          test "$(find zig-out/opcode-air -maxdepth 1 -type f -name '*.unsigned.json' | wc -l | tr -d ' ')" = 46

      - name: Repository-wide gates on the clean-room inputs
        run: |
          set -euo pipefail
          python3 scripts/riscv_team_b.py check --air-ir-dir zig-out/family-air
          python3 scripts/riscv_team_b_witnesses.py --air-ir-dir zig-out/family-air
          python3 scripts/riscv_team_a.py check \
            --air-program-ir-dir zig-out/opcode-air
          python3 scripts/riscv_opcode_coverage.py check
          (
            cd formal/riscv-refinement
            lake env lean RiscvRefinement/AxiomAudit.lean \
              > /tmp/clean-room-axioms.txt
          )
          if grep -E '^REFINEMENT_AXIOM ' /tmp/clean-room-axioms.txt \
              | grep -vE ' (propext|Classical\.choice|Quot\.sound)$'; then
            echo "unapproved axiom in clean-room theorem build" >&2
            exit 1
          fi
          python3 scripts/riscv_team_a.py axioms \
            --audit-output /tmp/clean-room-axioms.txt

      # The receipt binds what a clean room actually reproduced. It is not
      # signed with Sail evidence, because this job does not provision Sail;
      # the field says so rather than leaving a reader to assume otherwise.
      - name: Publish the clean-room receipt
        run: |
          set -euo pipefail
          python3 - <<'PY' > riscv-refinement-clean-room-receipt.json
          import hashlib, json, pathlib, subprocess

          def digest(path):
              return hashlib.sha256(pathlib.Path(path).read_bytes()).hexdigest()

          export = pathlib.Path("zig-out/family-air")
          payload = {
              "schema_version": 1,
              "kind": "stwo-riscv-refinement-clean-room-receipt",
              "revision": subprocess.run(
                  ["git", "rev-parse", "HEAD"],
                  capture_output=True, text=True, check=True,
              ).stdout.strip(),
              "regenerated_from_empty_caches": True,
              "sail_evidence": "absent: this job does not provision Sail",
              "air_families": {
                  path.name: digest(path) for path in sorted(export.glob("*.json"))
              },
              "unsigned_opcode_air": {
                  path.name: digest(path)
                  for path in sorted(
                      pathlib.Path("zig-out/opcode-air").glob(
                          "*.unsigned.json"
                      )
                  )
              },
              "legacy_coverage_inputs": {
                  "family_capsule_index": digest(
                      "formal/riscv-refinement/team-b-coverage.json"
                  ),
                  "local_air_index": digest(
                      "formal/riscv-refinement/team-a-coverage.json"
                  ),
              },
              "aggregate_opcode_coverage": digest(
                  "formal/riscv-refinement/opcode-coverage.json"
              ),
              "generated_manifest": digest(
                  "formal/riscv-refinement/generated-manifest.json"
              ),
          }
          payload["canonical_digest"] = hashlib.sha256(
              json.dumps(payload, sort_keys=True, separators=(",", ":")).encode()
          ).hexdigest()
          print(json.dumps(payload, indent=2, sort_keys=True))
          PY
          cat riscv-refinement-clean-room-receipt.json

      - name: Upload the clean-room receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: riscv-refinement-clean-room-receipt
          path: riscv-refinement-clean-room-receipt.json
          if-no-files-found: error
