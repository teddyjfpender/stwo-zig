# Live pinned-Sail/Spike retirement differential as a fail-closed gate.
#
# Sail is the one external, non-self-referential definition of RV32IM
# correctness in this repository; every other check compares the system
# against our own beliefs about it. This workflow re-derives the committed
# formal-corpus evidence with a freshly verified pinned toolchain whenever a
# change can alter what that evidence means, and daily on main as
# provisioning-rot insurance. Decision record, trigger policy, and runtime
# budget: conformance/riscv-sail-differential-gate.md.
#
# Fail-closed contract: pin drift, a Sail binary whose --build-info does not
# report the pinned model tag and compiler, any retirement disagreement,
# stale committed evidence, and an unbuildable toolchain are all RED. There
# is no skip path in the differential job; "Sail differential gates" is the
# required check and passes only when the live job succeeded or was
# genuinely out of scope for the diff.
#
# Green must mean "the differential agreed", never "the toolchain cache was
# warm". Two mechanisms make that structural rather than aspirational:
# a preflight step that proves the pinned toolchain functional on the warm
# path as well as the cold one, and receipts -- toolchain_health,
# differential_ran, sail_leg -- written by the steps that did the work and
# required by the verdict job. A step that never executes writes nothing,
# and the verdict reads an unwritten receipt as red.

name: RISC-V Sail differential

on:
  pull_request:
  push:
    branches: ["main"]
  schedule:
    - cron: "37 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scope:
    name: Scope the Sail differential
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      live_required: ${{ steps.scope.outputs.live_required }}
    steps:
      - name: Checkout complete comparison history
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        with:
          python-version: "3.13"

      - name: Select live differential scope
        id: scope
        run: |
          # Scheduled, dispatched, and post-merge main runs always go live;
          # PRs diff against the live merge-base exactly as the focused
          # planner does, so lagging event payloads cannot select for
          # already-merged commits.
          case "${{ github.event_name }}" in
            pull_request)
              BASE="$(git merge-base "origin/${{ github.base_ref }}" HEAD)"
              python3 scripts/riscv_sail_gate.py scope \
                --base "$BASE" --head "${{ github.sha }}" \
                --github-output "$GITHUB_OUTPUT"
              ;;
            push)
              python3 scripts/riscv_sail_gate.py scope \
                --base "${{ github.event.before }}" --head "${{ github.sha }}" \
                --github-output "$GITHUB_OUTPUT"
              ;;
            *)
              python3 scripts/riscv_sail_gate.py scope \
                --force-live --github-output "$GITHUB_OUTPUT"
              ;;
          esac

  differential:
    name: Sail/Spike retirement differential
    needs: scope
    if: needs.scope.outputs.live_required == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Receipts, not job status. Each is written by the step that did the
    # work, so an `if:`-skipped, edited-away, or never-reached step leaves it
    # empty -- and the verdict job refuses an empty receipt on a run where
    # the differential was selected.
    outputs:
      toolchain_health: ${{ steps.preflight.outputs.toolchain_health }}
      cache_state: ${{ steps.preflight.outputs.cache_state }}
      differential_ran: ${{ steps.differential.outputs.differential_ran }}
      sail_leg: ${{ steps.sail_leg.outputs.sail_leg }}
    steps:
      - name: Checkout complete policy history
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        with:
          python-version: "3.13"

      - name: Setup Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29  # v2
        with:
          version: 0.15.2

      # Keyed on every input that determines toolchain content: the formal
      # profile (source revisions, compiler version), the transport patch,
      # the Sail configuration overrides, and the builder that turns them
      # into binaries. A poisoned cache is discarded by bumping the -v2-
      # epoch; a merely stale one fails riscv_formal_tools.py verify and is
      # rebuilt from pins in this job. The key must stay byte-identical to
      # the save step's below -- a drift between them silently disables the
      # cache, which is slow rather than unsound but reads as neither.
      - name: Restore pinned formal toolchain workspace
        id: restore
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830  # v4
        with:
          path: ${{ runner.tool_cache }}/stwo-zig/riscv-formal
          key: riscv-formal-v2-${{ runner.os }}-${{ hashFiles('conformance/riscv/rv32im-sail-profile.json', 'conformance/riscv/sail-rvfi-zkvm-entry.patch', 'conformance/riscv/sail-rv32im-override.json', 'conformance/riscv/sail-rv32im-tagged-options.json', 'scripts/riscv_formal_tools.py') }}

      # device-tree-compiler is Spike's build dependency. z3 is Sail's: the
      # pinned 0.20.2 release binary shells out to an SMT solver, so without
      # it even `sail --version` dies with "SMT solver returned unexpected
      # status 127 / z3: not found". These steps are deliberately
      # unconditional: gating them on the cache would provision the toolchain
      # only where it is rebuilt, and the preflight below -- which does run
      # unconditionally -- is what keeps that mistake red instead of silent.
      - name: Install the pinned Spike and Sail system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends device-tree-compiler z3

      # The pinned Sail compiler ships as a hash-pinned upstream release
      # binary, so no opam bootstrap runs in CI. A profile compiler bump
      # deliberately breaks this step (resolve_sail_compiler rejects the old
      # version) until the URL and digest here are updated in the same
      # change -- that is the fail-closed direction.
      - name: Install the pinned Sail compiler release binary
        run: |
          test "$(uname -m)" = x86_64
          curl -fsSL -o "$RUNNER_TEMP/sail.tar.gz" \
            https://github.com/rems-project/sail/releases/download/0.20.2-binary/sail-Linux-x86_64.tar.gz
          echo "26b59bcab2d66e9f220d317dfe45f8b09170ed70e59a824553d6f525134d1ff6  $RUNNER_TEMP/sail.tar.gz" \
            | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/sail.tar.gz" -C "$RUNNER_TEMP"
          "$RUNNER_TEMP/sail/bin/sail" --version

      # The positive half of the fail-closed contract, and the only step here
      # that a warm cache cannot make vacuous: it executes the pinned Sail
      # compiler, the SMT solver it shells out to, and Spike's dtc on this
      # runner, whatever the cache did. A broken provision is red HERE, named
      # dependency by dependency, instead of surfacing as later steps that
      # "did not run". A cold or corrupt workspace is not a failure -- the
      # gate rebuilds it from pins and the differential still runs -- but it
      # is reported, and the save step below refuses to publish a workspace
      # the gate never proved usable.
      - name: Assert the pinned toolchain is functional (cache hit or miss)
        id: preflight
        run: |
          python3 scripts/riscv_sail_gate.py preflight \
            --workspace "$RUNNER_TOOL_CACHE/stwo-zig/riscv-formal" \
            --sail-compiler "$RUNNER_TEMP/sail/bin/sail" \
            --cache-hit "${{ steps.restore.outputs.cache-hit }}" \
            --github-output "$GITHUB_OUTPUT"

      - name: Run the fail-closed Sail/Spike differential gate
        id: differential
        run: |
          python3 scripts/riscv_sail_gate.py run \
            --workspace "$RUNNER_TOOL_CACHE/stwo-zig/riscv-formal" \
            --sail-compiler "$RUNNER_TEMP/sail/bin/sail" \
            --prepare-on-miss \
            --report-out "$RUNNER_TEMP/riscv-sail-differential-report.json" \
            --github-output "$GITHUB_OUTPUT"

      # This is the only job in the repository with a verified pinned oracle,
      # so it is the only place the Sail leg of the malicious-prover harness
      # can be REQUIRED instead of skipped. On every other host and job that
      # leg reports "SKIP: pinned Sail oracle unavailable", which is
      # indistinguishable from a passing check in a summary line.
      # STWO_ZIG_REQUIRE_SAIL_ORACLE makes an unavailable verdict return
      # error.SailOracleUnavailable -- a failure that names the absent oracle
      # and stays distinct from a Sail disagreement, so absence is refused
      # here without being redefined as divergence anywhere.
      #
      # Renaming the malicious-prover tests does NOT silently empty this step:
      # -Driscv-test-filter carries EmptySelectionGuard, which fails the build
      # when the filter matches no test name. Keep the filter aligned with
      # src/tests/riscv/malicious_prover_*.zig anyway -- the guard reports a
      # drifted filter, it does not repair one.
      - name: Require the Sail leg of the malicious-prover harness
        id: sail_leg
        env:
          STWO_RISCV_FORMAL_WORKSPACE: ${{ runner.tool_cache }}/stwo-zig/riscv-formal
          STWO_ZIG_REQUIRE_SAIL_ORACLE: "1"
        run: |
          # Probe first so a provisioning fault reads as one, rather than
          # surfacing minutes later inside a test binary.
          python3 scripts/riscv_sail_oracle.py probe
          zig build test-riscv-release-exhaustive \
            -Driscv-test-filter="malicious prover" -Doptimize=ReleaseSafe
          # Reached only when the required leg actually passed; the verdict
          # job treats an absent receipt as a leg that never ran.
          echo "sail_leg=required" >> "$GITHUB_OUTPUT"

      # Save even after a red differential -- a divergence investigation needs
      # the warm toolchain far more than a green run does -- but only when the
      # gate reported the workspace usable (verified from the cache, or
      # rebuilt from pins here). A cache entry is immutable once written under
      # a key, so publishing the half-built workspace of a toolchain-
      # unavailable run would hand every later run a corrupt restore it cannot
      # replace. That is the health condition on this cache: not a key
      # ingredient, but a refusal to cache what was never proven to work.
      - name: Save pinned formal toolchain workspace
        if: always() && (steps.differential.outputs.toolchain_state == 'verified' || steps.differential.outputs.toolchain_state == 'rebuilt')
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830  # v4
        with:
          path: ${{ runner.tool_cache }}/stwo-zig/riscv-formal
          key: riscv-formal-v2-${{ runner.os }}-${{ hashFiles('conformance/riscv/rv32im-sail-profile.json', 'conformance/riscv/sail-rvfi-zkvm-entry.patch', 'conformance/riscv/sail-rv32im-override.json', 'conformance/riscv/sail-rv32im-tagged-options.json', 'scripts/riscv_formal_tools.py') }}

      - name: Retain differential report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: riscv-sail-differential-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/riscv-sail-differential-report.json
          if-no-files-found: warn
          retention-days: 30

  verdict:
    name: Sail differential gates
    needs: [scope, differential]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      SCOPE_RESULT: ${{ needs.scope.result }}
      LIVE_REQUIRED: ${{ needs.scope.outputs.live_required }}
      DIFFERENTIAL_RESULT: ${{ needs.differential.result }}
      TOOLCHAIN_HEALTH: ${{ needs.differential.outputs.toolchain_health }}
      CACHE_STATE: ${{ needs.differential.outputs.cache_state }}
      DIFFERENTIAL_RAN: ${{ needs.differential.outputs.differential_ran }}
      SAIL_LEG: ${{ needs.differential.outputs.sail_leg }}
    steps:
      - name: Require the live differential wherever it was selected
        run: |
          # Every way this gate could report success without the differential
          # having run, refused explicitly:
          #   * the scope job did not decide                 -> SCOPE_RESULT
          #   * it decided something other than true/false: an unset or
          #     garbled output would otherwise fall through to the
          #     not-selected arm, where a skipped job is expected, and pass
          #                                                   -> LIVE_REQUIRED
          #   * the live job reported success with its work skipped -- broken
          #     provisioning, an edited-away step, a corrupt cache nobody
          #     rebuilt. The receipts are written by the steps that did the
          #     work, so absence is the signature of that case.
          # A legitimately unselected run has the opposite shape: no job, and
          # therefore no receipts at all.
          require() {  # require <actual> <expected> <what it establishes>
            if test "$1" != "$2"; then
              echo "Sail differential gate: $3: expected '$2', got '$1'" >&2
              exit 1
            fi
          }
          require "$SCOPE_RESULT" success "the scope job must decide the scope"
          case "$LIVE_REQUIRED" in
            true|false) ;;
            *)
              echo "Sail differential gate: scope produced no live_required decision (got '$LIVE_REQUIRED'); an absent decision is not 'out of scope'" >&2
              exit 1
              ;;
          esac
          if test "$LIVE_REQUIRED" = true; then
            require "$DIFFERENTIAL_RESULT" success "the live differential job"
            require "$TOOLCHAIN_HEALTH" functional \
              "the pinned toolchain must be proven functional on the runner"
            require "$DIFFERENTIAL_RAN" true \
              "Sail must have been consulted on the full committed corpus"
            require "$SAIL_LEG" required \
              "the malicious-prover harness must have run its required Sail leg"
            echo "Sail differential gates: the live differential ran against the pinned oracle (toolchain cache $CACHE_STATE)"
          else
            require "$DIFFERENTIAL_RESULT" skipped \
              "nothing in this diff can change what the attestation means"
            require "$TOOLCHAIN_HEALTH$DIFFERENTIAL_RAN$SAIL_LEG" "" \
              "an unselected differential must leave no receipts behind"
          fi
