[package]
name = "sha2"
version = "0.10.9"
edition = "2024"
publish = false
license = "MIT OR Apache-2.0"
description = "Original SHA-256 implementation for the pinned RV64 guest dependency graph"

[workspace]

[features]
default = ["std"]
std = ["digest/std"]
oid = ["digest/oid"]
# Execution-only candidate ECALL (profile ethereum_services_v3_candidate); not admitted.
stwo-candidate-sha256 = []
# ADMITTED `sha256_compress` service (profile ethereum_services_v3): the same
# ECALL and packet, with the 32-byte packet alignment the prover bridge binds.
stwo-sha256-service = []

[dependencies]
digest = { version = "=0.10.7", default-features = false, features = ["core-api"] }

[dev-dependencies]
sha2-reference = { package = "sha2", version = "=0.11.0", default-features = false }
