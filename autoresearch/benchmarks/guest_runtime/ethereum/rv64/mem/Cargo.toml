[package]
name = "stwo-rv64-mem"
version = "0.1.0"
edition = "2024"
publish = false
description = "memcpy/memmove/memset/memcmp for an RV64 guest without misaligned access"

[lib]
path = "src/lib.rs"

[workspace]

[features]
# Execution-only candidate ECALL services; never part of an admitted guest.
candidate-services = []
# ADMITTED ethereum_services_v3 bulk memory (aligned word memcpy/memset).
# Requires an execution profile/prover that admits tags 0x30001/0x30002.
admitted-bulk = []

[dependencies]
