[package]
name = "stwo-ethereum-rv64-guest"
version = "0.1.0"
edition = "2024"
publish = false
build = "../build.rs"

[[bin]]
name = "stwo-ethereum-rv64-guest"
path = "../src/main.rs"

[workspace]

[features]
default = []
keccak-service = ["alloy-primitives/native-keccak"]
secp-service = ["k256/stwo-projective-service"]
secp-word-service = ["secp-service", "k256/stwo-projective-word-service"]
# Lean ECDSA recovery: variable-time word-packet scalar multiplication and no
# redundant re-verification of the recovered key. Same service ABI/tags as v2.
secp-lean = ["secp-word-service", "k256/stwo-vartime", "dep:ecdsa", "ecdsa/stwo-skip-redundant-recovery-verify"]
# EXECUTION-ONLY candidate services (profile ethereum_services_v3_candidate,
# autoresearch/guest_efficiency/CONTEXT.md). Never part of an admitted guest;
# the prover cannot prove these ECALLs. One family per feature so each can be
# measured in isolation; `candidate-services` turns on all of them.
candidate-mem = ["stwo-rv64-mem/candidate-services"]
candidate-sha256 = ["dep:sha2", "sha2/stwo-candidate-sha256"]
candidate-arith = ["dep:revm-interpreter", "revm-interpreter/stwo-candidate-arith"]
candidate-services = ["candidate-mem", "candidate-sha256", "candidate-arith"]
# ADMITTED v3 service (profile ethereum_services_v3): SHA-256 compression via
# ECALL 0x0003_0010 on a 32-byte aligned packet. Proven by the Word16 services
# lane's SHA-256 truth and Wire35 bridge.
sha256-service = ["dep:sha2", "sha2/stwo-sha256-service"]
# ADMITTED v3 service (profile ethereum_services_v3): arith256_mod via ECALL
# 0x0003_0021 on a 32-byte aligned packet (MULMOD, ADDMOD). Proven by the Word16
# services lane's arith256 truth and Wire35 bridge.
arith256-service = ["dep:revm-interpreter", "revm-interpreter/stwo-arith256-service"]
# ADMITTED bulk memory (profile ethereum_services_v3): aligned word memcpy and
# memset through tags 0x30001/0x30002; heads, tails, overlap and mismatched
# alignment stay in software. See design/riscv-proving-stack/rv64-bulk-memory-service.md.
admitted-mem = ["stwo-rv64-mem/admitted-bulk"]

[dependencies]
alloy-consensus = { version = "=2.4.1", default-features = false, features = ["crypto-backend", "k256"] }
alloy-primitives = { version = "=1.6.1", default-features = false, features = ["map-foldhash"] }
critical-section = { version = "1.2", features = ["restore-state-bool"] }
k256 = { version = "=0.13.4", default-features = false, features = ["ecdsa"] }
ecdsa = { version = "=0.16.9", default-features = false, optional = true }
revm-precompile = { version = "=42.0.1", default-features = false }
# Optional direct edges only so candidate features can reach the vendored crates.
sha2 = { version = "=0.10.9", default-features = false, optional = true }
revm-interpreter = { version = "=42.0.0", default-features = false, optional = true }
stwo-rv64-mem = { path = "../mem" }
stateless-validator-reth = { git = "https://github.com/paradigmxyz/stateless.git", rev = "a134a621bad7229ff7f980e42dfca8e22d101491", default-features = false }

[profile.release]
panic = "abort"
opt-level = 3
lto = "fat"
codegen-units = 1

[profile.dev]
panic = "abort"


[patch.crates-io]
k256 = { path = "../vendor/k256" }
ecdsa = { path = "../vendor/ecdsa" }
revm-interpreter = { path = "../vendor/revm-interpreter" }
revm-bytecode = { path = "../vendor/revm-bytecode" }
sha2 = { path = "../vendor/sha2-rv64" }

[patch."https://github.com/paradigmxyz/stateless.git"]
zeth-mpt = { path = "../vendor/zeth-mpt" }
