[package]
name = "stwo-ethereum-rv64-guest"
version = "0.1.0"
edition = "2024"
publish = false
build = "../build.rs"

[[bin]]
name = "stwo-ethereum-rv64-guest"
path = "../src/main.rs"

[workspace]

[features]
default = []
keccak-service = ["alloy-primitives/native-keccak"]
secp-service = ["k256/stwo-projective-service"]
secp-word-service = ["secp-service", "k256/stwo-projective-word-service"]

[dependencies]
alloy-consensus = { version = "=2.4.1", default-features = false, features = ["crypto-backend", "k256"] }
alloy-primitives = { version = "=1.6.1", default-features = false, features = ["map-foldhash"] }
critical-section = { version = "1.2", features = ["restore-state-bool"] }
k256 = { version = "=0.13.4", default-features = false, features = ["ecdsa"] }
revm-precompile = { version = "=42.0.1", default-features = false }
stateless-validator-reth = { git = "https://github.com/paradigmxyz/stateless.git", rev = "a134a621bad7229ff7f980e42dfca8e22d101491", default-features = false }

[profile.release]
panic = "abort"
opt-level = 3
lto = "fat"
codegen-units = 1

[profile.dev]
panic = "abort"


[patch.crates-io]
k256 = { path = "../vendor/k256" }
