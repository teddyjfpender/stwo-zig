[package]
name = "stwo-interop-rs"
version = "0.1.0"
edition = "2021"

[features]
slow-tests = []

[dependencies]
anyhow = "1.0"
hex = "0.4"
itertools = "0.13"
num-traits = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
stwo = { git = "https://github.com/starkware-libs/stwo", rev = "a8fcf4bdde3778ae72f1e6cfe61a38e2911648d2", features = ["prover", "parallel"] }
stwo-constraint-framework = { git = "https://github.com/starkware-libs/stwo", rev = "a8fcf4bdde3778ae72f1e6cfe61a38e2911648d2", features = ["prover", "parallel"] }
stwo-examples = { git = "https://github.com/starkware-libs/stwo", rev = "a8fcf4bdde3778ae72f1e6cfe61a38e2911648d2", features = ["parallel"] }
tracing = "0.1"

[dev-dependencies]
test-log = { version = "0.2.15", features = ["trace"] }
