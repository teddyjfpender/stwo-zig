[workspace]

[package]
name = "cairo-witness-rewriter"
version = "0.1.0"
edition = "2024"
publish = false

[[bin]]
name = "cairo-witness-rewriter"
path = "src/main.rs"

[dependencies]
proc-macro2 = "=1.0.106"
quote = "=1.0.46"
syn = { version = "=2.0.118", features = [
    "extra-traits",
    "full",
    "parsing",
    "printing",
    "visit",
    "visit-mut",
] }
