[package]
name = "stwo-cuda-adapter-rs"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1.0"
hex = "0.4"
num-traits = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
stwo = { path = ".authority/crates/stwo", features = ["prover", "parallel"] }
stwo-backend-cuda = { path = ".authority/crates/backend-cuda", features = ["parallel"] }
stwo-backend-cuda-kernels = { path = ".authority/crates/backend-cuda-kernels" }
