[package]
name = "stwo-cairo-trace-oracle"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[package.metadata.canonical-oracle]
checkpoint-abi = "STWO_CAIRO_BASE_CHECKPOINT_V1"
stwo-cairo-repository = "https://github.com/starkware-libs/stwo-cairo"
stwo-cairo-revision = "82f21252a68ec006d73e299f5bf1ce6d4db0ee78"
stwo-repository = "https://github.com/starkware-libs/stwo"
stwo-revision = "7b211edde786775016ef3eecb837a6240d8fe792"

[dependencies]
anyhow = "1.0"
cairo-air = { git = "https://github.com/starkware-libs/stwo-cairo", rev = "82f21252a68ec006d73e299f5bf1ce6d4db0ee78" }
hex = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
stwo = { git = "https://github.com/starkware-libs/stwo", rev = "7b211edd", features = ["parallel", "prover"] }
stwo-cairo-adapter = { git = "https://github.com/starkware-libs/stwo-cairo", rev = "82f21252a68ec006d73e299f5bf1ce6d4db0ee78" }
stwo-cairo-common = { git = "https://github.com/starkware-libs/stwo-cairo", rev = "82f21252a68ec006d73e299f5bf1ce6d4db0ee78" }
stwo-cairo-prover = { git = "https://github.com/starkware-libs/stwo-cairo", rev = "82f21252a68ec006d73e299f5bf1ce6d4db0ee78" }

[profile.release]
codegen-units = 1
lto = "thin"

[workspace]
